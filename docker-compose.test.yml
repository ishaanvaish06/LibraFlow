# CI / integration-test environment: Postgres + Redis + the test target.
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=libraflow
      - POSTGRES_USER=libraflow_user
      - POSTGRES_PASSWORD=libraflow_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraflow_user -d libraflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - ENVIRONMENT=test
      - LIBRAFLOW_SECRET_KEY=test-only-secret
      - TEST_DATABASE_URL=postgresql+psycopg2://libraflow_user:libraflow_secret@postgres:5432/libraflow
      - TEST_REDIS_HOST=redis
      - TEST_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head
      && python -m pytest tests/ -v --strict-markers"